# VORTIX — nginx site config for the AWS server (nginx 1.24)
#
# Replace only the marked values (server_name, certificate paths, root) and keep the rest.
# Fixes: BUG-01 (double /api), BUG-02 (/share preview), BUG-07 (security headers),
# BUG-08 (asset caching), plus the 1 MB upload limit for product images.
#
# Apply:
#   sudo cp deploy/nginx-voltix.conf /etc/nginx/sites-available/voltix
#   sudo ln -sf /etc/nginx/sites-available/voltix /etc/nginx/sites-enabled/voltix
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name voltix-store.duckdns.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name voltix-store.duckdns.org;

    # ---- keep your existing certificate lines -------------------------------------
    ssl_certificate     /etc/letsencrypt/live/voltix-store.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voltix-store.duckdns.org/privkey.pem;
    # ------------------------------------------------------------------------------

    # Product image uploads are multipart; the nginx default of 1 MB is too small.
    client_max_body_size 15m;

    # BUG-07 — the Express API already sends these, the static site did not.
    # Keep all add_header directives at server level: a nested add_header would cancel them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /var/www/voltix;
    index index.html;

    # BUG-08 — filenames contain a content hash, so they can be cached for a year.
    # `expires` is used instead of add_header so the security headers above still apply.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # BUG-01 (legacy) — a bundle that still sends /api/api/... keeps working, so nginx and
    # the frontend can be updated in either order.
    location /api/api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BUG-01 — documented paths now reach the API unchanged:
    #   /api/products, /api/users/login, /api/payments/webhook
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BUG-02 — WhatsApp / Telegram previews (server-rendered HTML, no JavaScript).
    location /share/ {
        proxy_pass http://127.0.0.1:5000/share/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React router: every other path gets index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }
}
