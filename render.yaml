services:
  - type: web
    name: voltix-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: ORDER_EXPIRY_MINUTES
        value: "30"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OTP_HASH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
